# 2026-09-25 (Play-readiness audit): MapLibre 13's default `android-sdk` artifact renders with Vulkan
# and its manifest adds a REQUIRED android.hardware.vulkan.version feature, so Play would hide the
# app from every phone without Vulkan 1.0 just to draw a route map. `android-sdk-opengl` is the same
# release and the same API on the OpenGL ES backend, with no Vulkan requirement.
maplibre-android-sdk = { group = "org.maplibre.gl", name = "android-sdk-opengl", version.ref = "maplibre" }
androidx-health-connect-client = { group = "androidx.health.connect", name = "connect-client", version.ref = "healthConnect" }
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
