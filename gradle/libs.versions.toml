[versions]
# Pinned deliberately at project creation (2026-08-23) — see docs/adr/0001-toolchain-and-di.md.
# This exact quadruple (AGP / Kotlin / KSP / Compose BOM) is Fiterval's proven working set;
# do not bump any one of them independently — see the Fiterval toolchain lesson in the vault.
agp = "9.2.0"
kotlin = "2.3.0"
ksp = "2.3.9"
composeBom = "2026.06.00"

coreKtx = "1.18.0"
material = "1.14.0"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
navigationCompose = "2.9.4"
room = "2.7.1"
hilt = "2.60.1" # AGP 9 support landed in 2.59; 2.57.2 predates it entirely ("Android BaseExtension not found")
hiltNavigationCompose = "1.3.0"
datastorePreferences = "1.1.7"
kotlinxCoroutines = "1.10.2"
kotlinxSerializationJson = "1.9.0"
kotlinxDatetime = "0.7.1"
reorderable = "3.1.0" # M20a — https://github.com/Calvin-LL/Reorderable/releases; re-attempt of the M3 library (see vault lessons-learned 2026-08-23: scroll gate)
coil = "3.5.0" # M20b — https://github.com/coil-kt/coil/releases; the plan's 3.6.2 pick FAILED the AAR-metadata check (needs compileSdk 37, drags in Compose 1.12.0) — 3.5.0 resolves Compose Multiplatform 1.11.1 (matches our BOM) and is the named fallback
koalaplot = "0.12.1" # M20c (ADR-0009) — https://github.com/KoalaPlot/koalaplot-core/releases; built with Kotlin 2.4.10 — spike on our pinned 2.3.0
flexibleBottomSheet = "0.3.0" # M20d — https://github.com/skydoves/FlexibleBottomSheet/releases; non-modal (interact-behind) plate calculator sheet
composeUnstyled = "2.9.0" # M20e — https://github.com/composablehorizons/compose-unstyled/releases; needs jvmTarget 17; 2.9.2+ is built on CMP 1.12 (ahead of our 1.11.3) — stay on 2.9.0
calendar = "2.10.1" # M20f — https://github.com/kizitonwose/Calendar/releases; java.time artifact; compat table maps Compose UI 1.11.x -> Calendar 2.10.x (our resolved 1.11.3 is in-table)
playServicesLocation = "21.4.0" # M21a — https://developers.google.com/android/guides/releases; verified by direct AAR manifest inspection (2026-09-09) to declare zero permissions, including no INTERNET -- see decisions.md
maplibre = "13.6.1" # M21b — https://github.com/maplibre/maplibre-native/releases; classic AndroidView-wrapped MapView, not maplibre-compose (that wrapper needs Kotlin 2.4.10, ahead of our 2.3.0 pin). 2026-09-25: the OpenGL ES build of the same release (see the library entry below), not the default Vulkan one.
healthConnect = "1.1.0" # M21e — https://developer.android.com/jetpack/androidx/releases/health-connect; latest STABLE (not the 1.2.0-alpha06 available at the time) per this project's never-alpha/beta/rc rule. Compat spike (2026-09-10): minCompileSdk=36 (exact match), minSdk 26 (exact match), minAndroidGradlePluginVersion=8.9.1 (well under our 9.2.0), kotlin-stdlib dep floor 2.0.21 (well under our 2.3.0) -- all clean, no fallback needed, direct AAR/POM inspection per this project's own dependency-vetting discipline.
camerax = "1.6.2" # M22a — https://developer.android.com/jetpack/androidx/releases/camera; latest STABLE (2026-08-26) per this project's never-alpha/beta/rc rule (1.7.0 is still alpha). In-app camera capture for progress photos, no overlay compositing this pass. Compat check (2026-09-20): our compileSdk 36.1/minSdk 26 comfortably clear the industry-wide minSdk-23 floor AndroidX moved to in mid-2025 and CameraX's own compileSdk-35 floor as of the 1.5.0 beta (a full minor behind this pin) -- verified empirically by a clean assembleDebug with no AAR-metadata error, same signal the coil/healthConnect pins above relied on.
glance = "1.2.0" # M23b -- https://developer.android.com/jetpack/androidx/releases/glance; latest STABLE (2026-08-26) per this project's never-alpha/beta/rc rule. 1.3.0-alpha is NOT an option: it requires compileSdk 37 and we are pinned at 36.1 -- the exact AAR-metadata wall the coil 3.6.2 pick hit above. Compat spike (2026-09-22): AAR built against compileSdk 35, minSdk 23, minAndroidGradlePluginVersion 8.6.0, compose-runtime floor 1.7.8 -- all comfortably under our 36.1 / 26 / 9.2.0 / BOM-resolved runtime.
work = "2.11.2" # M23b -- https://developer.android.com/jetpack/androidx/releases/work. Pinned EXPLICITLY rather than inherited: glance-appwidget's POM drags in work-runtime-ktx 2.7.1 (Oct 2021) at runtime scope, and Gradle's newest-wins resolution means this line is the only thing keeping us off a five-year-old scheduler on targetSdk 36. Do NOT delete it as "unused" -- MidnightWidgetWorker is the direct consumer, and removing it silently hands the floor back to the transitive 2.7.1.

junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
robolectric = "4.13"
androidxTestCore = "1.6.1"

spotless = "7.0.2"
detekt = "1.23.8"

exifinterface = "1.4.2" # 2026-09-25 (Play-readiness audit, lint ExifInterface warning): the framework android.media.ExifInterface has known bugs on older Android releases; this is the AndroidX replacement. Exactly the version camera-core 1.6.2 already pulls in at runtime scope (checked in its POM), so declaring it adds nothing to the APK -- it only makes the API visible at compile time.

