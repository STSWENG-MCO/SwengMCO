# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# This project requires JDK 17-21 to build and test. Robolectric 4.13's bundled ASM cannot parse
# class files from JDK 25+ ("Unsupported class file major version 69"), so a JDK 25+ `JAVA_HOME`
# will fail `./gradlew test`. Point JAVA_HOME at a JDK 17-21 install (Android Studio's bundled JBR
# works well) rather than hardcoding org.gradle.java.home here, since that path differs per OS/
# machine — set it locally in `~/.gradle/gradle.properties` or your shell environment instead.

# Public developer contact email (Play-readiness audit, 2026-09-25). It appears in the privacy
# policy, the hosted policy page (site/privacy/) and Settings > About > Send feedback, and Play lists
# the same address on the store page, so it is public by design. Leave it empty until the dedicated
# LogEZ address exists: debug builds then show a visible placeholder, and release builds
# (packageRelease / packageReleaseBundle) refuse to build. After changing it, run the unit tests and
# copy the regenerated policy page they point to into site/privacy/index.html.
logez.contactEmail=

# Required by AGP 9.2+ to run Gradle Managed Devices on minSdk 26 (API <= 26).
android.experimental.testOptions.managedDevices.allowOldApiLevelDevices=true
