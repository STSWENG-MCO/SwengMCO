# compiles staging build and distributes build artifacts for verification
# runs on pushes and merges to develop and release branches. or done manually
name: CD

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-staging:
    name: Build & Distribute Staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
      - uses: gradle/actions/setup-gradle@v4

      - name: Build Staging APK
        run: ./gradlew :app:assembleStaging --console=plain

      - name: Upload Staging APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-apk
          path: app/build/outputs/apk/staging/*.apk
          retention-days: 14