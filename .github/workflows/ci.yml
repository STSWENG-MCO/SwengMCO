# unit tests, release lint, debug build, and Room schema validation
# runs on pushes and pull requests to main, develop, and release branches
name: CI

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop, 'release/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Test, Lint, & Compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # JDK 21: Robolectric cannot read class files from JDK 25+ (see gradle.properties).
      - name: Set up JDK 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      
      - name: Set up Gradle
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Release lint
        run: ./gradlew :app:lintRelease --console=plain

      - name: Debug build (assembleDebug)
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Database schema verification
        run: git diff --exit-code app/schemas

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/

  deploy-staging:
    name: Trigger Staging CD
    needs: [test-and-lint]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/'))
    uses: ./.github/workflows/cd.yml
    secrets: inherit
